name: Static Frontend CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build static site (GLOBAL)
        env:
          NEXT_PUBLIC_API_URL_FASTAPI: https://v2-api.fordgeindia.online/api
        run: npm run build

      # 1️⃣ Upload ALL static assets (hashed) → long cache
      # Exclude all index.html files (root and routes) to handle them separately
      - name: Upload static assets with long cache
        run: |
          aws s3 sync out s3://${{ secrets.S3_BUCKET }} \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

      # 2️⃣ Upload ALL index.html files (root + routes) → no cache (CRITICAL)
      # This ensures direct URL access and refreshes work correctly
      - name: Upload all index.html files with no cache
        run: |
          find out -name "index.html" -type f | while read file; do
            s3_path="${file#out/}"
            aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET }}/$s3_path" \
              --cache-control "no-cache,no-store,must-revalidate"
          done

      # 3️⃣ Invalidate CloudFront
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"


